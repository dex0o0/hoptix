[package]
name = "hoptix"
version = "0.1.0"
edition = "2024"

[lib]
name = "hoptix"
path ="src/lib.rs"

[[bin]]
name = "hoptixd"
path = "src/main.rs"

[[bin]]
name = "hoptix"
path = "src/bin/cli.rs"

[dependencies]
clap = {version= "4.6.4" , features=["derive"]}
dirs = "6.0.0"
futures = "0.3.33"
get_if_addrs = "0.5.3"
indicatif = "0.18.6"
reqwest = {version= "0.13.4",features=["json","stream"]}
serde = {version= "1.0.229",features=["derive"]}
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = {version= "1.53.1",features=["full"]}
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
